<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laura Leiboff — Piste map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #CFE8FF;
    --snow: #FFFFFF;
    --shade: #B9D3EE;
    --green: #1FA84F;
    --blue: #1565D8;
    --red: #E53935;
    --black: #141414;
    --pine: #1D5C3A;
    --sign: #FFD23F;
    --ink: #172033;
    --muted: #4E5B73;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #9FB8D3;
    font-family: "Manrope", system-ui, sans-serif;
    color: var(--ink);
    font-size: 9.5pt;
    line-height: 1.4;
    padding: 24px 16px;
  }
  .page {
    width: 210mm;
    min-height: 297mm;
    margin: 0 auto;
    background: var(--snow);
    box-shadow: 0 10px 34px rgba(23,32,51,.3);
    display: flex; flex-direction: column;
  }
  .banner {
    background: var(--red);
    color: #fff;
    padding: 7mm 12mm 6mm;
    display: flex; align-items: center; gap: 6mm;
  }
  .banner img { width: 26mm; height: 26mm; object-fit: cover; border-radius: 3mm; border: 3px solid #fff; flex: none; }
  h1 { font-family: "Unbounded", sans-serif; font-weight: 900; font-size: 30pt; line-height: 1; margin: 0; letter-spacing: -.02em; }
  .banner p { margin: 2mm 0 0; font-weight: 500; }
  .banner .contact { opacity: .9; font-size: 9.5pt; margin-top: 1mm; }
  .cross {
    margin-left: auto; flex: none;
    width: 20mm; height: 20mm; background: #fff; position: relative; border-radius: 2mm;
  }
  .cross::before, .cross::after { content: ""; position: absolute; background: var(--red); }
  .cross::before { left: 8mm; top: 3.5mm; width: 4mm; height: 13mm; }
  .cross::after { top: 8mm; left: 3.5mm; height: 4mm; width: 13mm; }

  .map { display: block; width: 100%; height: auto; background: var(--sky); }
  .map .num { font-family: "Unbounded", sans-serif; font-weight: 700; font-size: 15px; fill: #fff; text-anchor: middle; dominant-baseline: central; }
  .map .peak { font-family: "Unbounded", sans-serif; font-weight: 700; font-size: 13px; fill: var(--ink); }
  .map .alt { font-family: "Manrope", sans-serif; font-size: 11px; fill: var(--muted); }

  .content { display: grid; grid-template-columns: 1.5fr 1fr; gap: 9mm; padding: 6mm 12mm 7mm; flex: 1; }
  h2 { font-family: "Unbounded", sans-serif; font-weight: 700; font-size: 12.5pt; margin: 0 0 3.5mm; }

  .runs { list-style: none; padding: 0; margin: 0; }
  .runs li { display: grid; grid-template-columns: 9mm 1fr; gap: 3mm; margin-bottom: 2.6mm; }
  .mark {
    width: 8mm; height: 8mm; display: grid; place-items: center;
    font-family: "Unbounded", sans-serif; font-weight: 700; font-size: 9pt; color: #fff;
    border-radius: 50%;
  }
  .g { background: var(--green); } .b { background: var(--blue); } .r { background: var(--red); } .k { background: var(--black); }
  .runs h3 { margin: 0; font-size: 10.5pt; font-weight: 700; }
  .runs .meta { color: var(--muted); font-size: 9pt; }
  .runs p { margin: .5mm 0 0; }

  .legend { display: flex; flex-wrap: wrap; gap: 2mm 4mm; margin: 0 0 3mm; padding: 0; list-style: none; font-size: 9pt; }
  .legend li { display: flex; align-items: center; gap: 1.5mm; }
  .legend i { width: 5mm; height: 2.2mm; border-radius: 1mm; display: inline-block; }

  .about { margin: 0 0 3.5mm; font-size: 10pt; }
  .board {
    background: var(--sign); border-radius: 2.5mm; padding: 3.5mm 4mm; margin-bottom: 4mm;
    display: grid; grid-template-columns: 1fr 1fr; gap: 2mm 4mm;
  }
  .board b { font-family: "Unbounded", sans-serif; font-size: 16pt; display: block; line-height: 1.1; }
  .board span { font-size: 8.5pt; }
  .side section { margin-bottom: 4.5mm; }
  .side ul { list-style: none; padding: 0; margin: 0; }
  .side li { margin-bottom: 1.3mm; }
  .side li strong { display: inline-block; min-width: 16mm; }

  @media screen and (max-width: 820px) {
    body { padding: 0; }
    .page { width: 100%; min-height: 0; box-shadow: none; }
    .banner { flex-wrap: wrap; padding: 20px 16px; }
    .cross { display: none; }
    .content { grid-template-columns: 1fr; padding: 20px 16px; }
    h1 { font-size: 24pt; }
  }
  @page { size: A4; margin: 0; }
  @media print {
    body { background: none; padding: 0; }
    .page { box-shadow: none; margin: 0; height: 297mm; overflow: hidden; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
  /* Screen-only toolbar: back to gallery + print */
  .cv-toolbar {
    width: 210mm; max-width: 100%;
    margin: 0 auto 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    font: 500 12px/1.4 system-ui, sans-serif;
    color: #172033;
  }
  .cv-toolbar a { color: inherit; font-weight: 700; text-decoration: none; }
  .cv-toolbar a:hover { text-decoration: underline; }
  .cv-toolbar div { display: flex; align-items: center; gap: 14px; }
  .cv-toolbar button {
    background: #E53935; color: #E53935#172033; border: 0; border-radius: 7px;
    padding: 9px 14px; font: inherit; font-weight: 700; cursor: pointer;
  }
  .cv-toolbar button:hover { filter: brightness(1.15); }
  .cv-toolbar :focus-visible { outline: 3px solid #FFC145; outline-offset: 3px; }
  @media screen and (max-width: 820px) { .cv-toolbar { margin: 0; padding: 12px 16px; } .cv-toolbar span { display: none; } }
  @media print { .cv-toolbar { display: none; } }
</style>
</head>
<body data-design="piste">
<nav class="cv-toolbar" aria-label="Design controls">
  <a href="../index.html">← All designs</a>
  <div><span>08 / Piste map</span><button type="button" onclick="window.print()">Print / PDF</button></div>
</nav>
<main class="page">
  <header class="banner">
    <img src="photo.jpg" alt="Laura Leiboff">
    <div>
      <h1 data-cv="name"></h1>
      <p data-cv="title"></p>
      <p class="contact"><span data-cv="phone"></span> &nbsp;/&nbsp; <a data-cv="email"></a> &nbsp;/&nbsp; <span data-cv="nationality"></span></p>
    </div>
  </header>

  <svg class="map" viewBox="0 28 800 350" aria-label="Career drawn as a ski-resort trail map with seven numbered runs">
    <defs>
      <symbol id="tree" viewBox="0 0 20 30"><path d="M10 0 L20 22 L13 22 L13 30 L7 30 L7 22 L0 22 Z" fill="var(--pine)"/></symbol>
    </defs>
    <!-- far peaks -->
    <path d="M0,260 L120,170 L220,215 L330,120 L460,180 L560,110 L700,170 L800,140 L800,400 L0,400 Z" fill="#E6F1FC"/>
    <!-- main massif -->
    <path d="M0,400 L0,235 L180,115 L290,190 L400,48 L520,150 L640,92 L800,205 L800,400 Z" fill="var(--snow)"/>
    <!-- shadow facets -->
    <path d="M180,115 L290,190 L250,240 L200,170 Z" fill="var(--shade)" opacity=".7"/>
    <path d="M400,48 L520,150 L470,215 L430,120 Z" fill="var(--shade)" opacity=".7"/>
    <path d="M640,92 L800,205 L800,260 L690,170 Z" fill="var(--shade)" opacity=".7"/>
    <!-- lift -->
    <line x1="300" y1="370" x2="398" y2="58" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="6 4"/>
    <circle cx="300" cy="370" r="4" fill="var(--ink)"/><circle cx="398" cy="58" r="4" fill="var(--ink)"/>

    <!-- runs -->
    <g fill="none" stroke-width="6" stroke-linecap="round">
      <path data-run="1" d="M150,145 C105,215 150,285 70,372"/>
      <path data-run="2" d="M180,125 C150,200 230,260 160,370"/>
      <path data-run="3" d="M200,140 C260,210 220,290 290,370"/>
      <path data-run="4" d="M380,90 C330,170 400,250 360,375"/>
      <path data-run="5" d="M420,90 C480,170 430,260 480,375"/>
      <path data-run="6" d="M405,62 C560,140 520,240 600,370"/>
      <path data-run="7" d="M640,110 C700,190 640,280 720,370"/>
    </g>
    <g stroke="#fff" stroke-width="2.5">
      <circle data-run="1" cx="122" cy="252" r="13"/>
      <circle data-run="2" cx="185" cy="234" r="13"/>
      <circle data-run="3" cx="241" cy="251" r="13"/>
      <circle data-run="4" cx="366" cy="216" r="13"/>
      <circle data-run="5" cx="454" cy="219" r="13"/>
      <circle data-run="6" cx="530" cy="197" r="13"/>
      <circle data-run="7" cx="672" cy="236" r="13"/>
    </g>
    <text class="num" x="122" y="252">1</text><text class="num" x="185" y="234">2</text><text class="num" x="241" y="251">3</text><text class="num" x="366" y="216">4</text>
    <text class="num" x="454" y="219">5</text><text class="num" x="530" y="197">6</text><text class="num" x="672" y="236">7</text>

    <!-- peak names -->
    <text class="peak" x="412" y="40">Kibo</text><text class="alt" x="452" y="40">5,895 m</text>
    <text class="peak" x="650" y="80">Camp 2026</text>

    <!-- trees -->
    <g>
      <use href="#tree" x="20" y="355" width="16" height="24"/><use href="#tree" x="44" y="362" width="14" height="21"/>
      <use href="#tree" x="70" y="350" width="18" height="27"/><use href="#tree" x="96" y="360" width="14" height="21"/>
      <use href="#tree" x="214" y="358" width="15" height="22"/><use href="#tree" x="404" y="352" width="17" height="25"/>
      <use href="#tree" x="428" y="362" width="13" height="19"/><use href="#tree" x="540" y="356" width="16" height="24"/>
      <use href="#tree" x="640" y="360" width="15" height="22"/><use href="#tree" x="748" y="350" width="18" height="27"/>
      <use href="#tree" x="772" y="362" width="13" height="19"/>
    </g>
    <!-- village -->
    <rect x="0" y="384" width="800" height="16" fill="#E6F1FC"/>
  </svg>

  <div class="content">
    <section>
      <h2>Runs, in order of descent</h2>
      <ul class="legend">
        <li><i class="g"></i>Guiding</li>
        <li><i class="b"></i>Ski teaching</li>
        <li><i class="r"></i>Team &amp; camp management</li>
        <li><i class="k"></i>Expeditions</li>
      </ul>
      <ol class="runs" data-jobs></ol>
    </section>

    <aside class="side">
      <p class="about" data-cv="intro"></p>
      <div class="board">
        <div><b data-cv="countries"></b><span>countries travelled</span></div>
        <div><b><span data-cv="kilimanjaro"></span>×</b><span>Kilimanjaro</span></div>
        <div><b data-cv="eventSize"></b><span>people at one event</span></div>
        <div><b data-cv="languagesCount"></b><span>languages</span></div>
      </div>
      <section>
        <h2>Languages</h2>
        <ul data-languages></ul>
      </section>
      <section>
        <h2>Education</h2>
        <ul data-education></ul>
      </section>
      <section>
        <h2>Après-ski</h2>
        <ul data-interests></ul>
      </section>
    </aside>
  </div>
</main>
<script src="../content.js"></script>
<script src="render.js"></script>
</body>
</html>
