<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laura Leiboff — Riso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #FF48B0;
    --blue: #3255A4;
    --yellow: #FFE800;
    --paper: #FFFFFF;
    --ink: #24346E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #ECECEC;
    font-family: "Archivo", system-ui, sans-serif;
    color: var(--ink);
    font-size: 10pt;
    line-height: 1.45;
    padding: 24px 16px;
  }
  .page {
    width: 210mm;
    min-height: 297mm;
    margin: 0 auto;
    background: var(--paper);
    position: relative;
    overflow: hidden;
    padding: 12mm 12mm 12mm;
    box-shadow: 0 8px 30px rgba(0,0,0,.18);
    isolation: isolate;
  }
  /* halftone blobs printed in yellow and pink */
  .dots {
    position: absolute; z-index: -1; border-radius: 50%;
    mix-blend-mode: multiply;
  }
  .dots.y {
    width: 120mm; height: 120mm; right: -30mm; top: -25mm;
    background: radial-gradient(circle, var(--yellow) 42%, transparent 44%) 0 0 / 4mm 4mm;
  }
  .dots.p {
    width: 80mm; height: 80mm; right: -35mm; bottom: -35mm;
    background: radial-gradient(circle, var(--pink) 30%, transparent 32%) 0 0 / 3.2mm 3.2mm;
    opacity: .6;
  }

  .name {
    position: relative;
    font-family: "Anton", sans-serif;
    font-size: 92pt;
    line-height: .86;
    margin: 0;
    text-transform: uppercase;
    letter-spacing: -.005em;
  }
  .name span { display: block; color: var(--blue); text-shadow: 1.3mm 1.1mm 0 rgba(255,72,176,.4); }
  .name span + span { color: var(--pink); margin-left: 18mm; text-shadow: -1.1mm -.9mm 0 rgba(50,85,164,.3); }

  .tagline {
    font-family: "Anton", sans-serif; font-size: 20pt; line-height: 1.05;
    color: var(--ink); margin: 5mm 0 0; max-width: 120mm;
  }
  .contact { margin: 2mm 0 0; font-weight: 500; }

  .badge {
    position: absolute; right: 14mm; top: 64mm;
    width: 48mm; height: 48mm; border-radius: 50%;
    background: var(--pink);
    color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; transform: rotate(8deg);
    box-shadow: 1.2mm 1.2mm 0 var(--blue);
  }
  .badge b { font-family: "Anton", sans-serif; font-size: 44pt; line-height: .95; }
  .badge span { font-weight: 700; font-size: 10pt; }

  .photo-wrap { position: absolute; right: 50mm; top: 14mm; width: 36mm; height: 46mm; background: var(--blue); }
  .photo-wrap img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.15) brightness(1.15); mix-blend-mode: screen; display: block; }

  .about {
    font-size: 11.5pt; line-height: 1.5; margin: 8mm 0 0; max-width: 125mm;
  }

  .cols { display: grid; grid-template-columns: 1.6fr 1fr; gap: 10mm; margin-top: 9mm; }
  h2 {
    font-family: "Anton", sans-serif; font-weight: 400;
    font-size: 22pt; line-height: 1; margin: 0 0 4mm;
    color: var(--pink);
  }
  .jobs { list-style: none; margin: 0; padding: 0; }
  .jobs li { display: grid; grid-template-columns: 22mm 1fr; gap: 3mm; padding: 2.6mm 0; border-top: 2px solid var(--blue); }
  .jobs li:last-child { border-bottom: 2px solid var(--blue); }
  .yr { font-family: "Anton", sans-serif; font-size: 13pt; color: var(--blue); line-height: 1.1; }
  .jobs h3 { margin: 0; font-size: 11pt; font-weight: 700; }
  .jobs p { margin: .6mm 0 0; }
  .jobs .at { color: var(--pink); font-weight: 700; }

  .side section { margin-bottom: 7mm; }
  .side ul { list-style: none; margin: 0; padding: 0; }
  .side li { margin-bottom: 1.5mm; }
  .lang b { display: inline-block; min-width: 18mm; }
  .chips { display: flex; flex-wrap: wrap; gap: 2mm; }
  .chips span { background: var(--yellow); padding: .8mm 2.6mm; font-weight: 500; }
  .kili {
    background: var(--blue); color: #fff; padding: 4mm;
    font-family: "Anton", sans-serif; font-size: 16pt; line-height: 1.05;
  }
  .kili small { display: block; font-family: "Archivo", sans-serif; font-size: 9pt; margin-top: 1.5mm; color: var(--yellow); }

  @media screen and (max-width: 820px) {
    body { padding: 0; }
    .page { width: 100%; min-height: 0; padding: 16px; }
    .name { font-size: 64pt; }
    .badge, .photo-wrap { position: static; margin: 16px 0; transform: none; }
    .cols { grid-template-columns: 1fr; }
  }
  @page { size: A4; margin: 0; }
  @media print {
    body { background: none; padding: 0; }
    .page { box-shadow: none; margin: 0; height: 297mm; overflow: hidden; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
  /* Screen-only toolbar: back to gallery + print */
  .cv-toolbar {
    width: 210mm; max-width: 100%;
    margin: 0 auto 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    font: 500 12px/1.4 system-ui, sans-serif;
    color: #24346E;
  }
  .cv-toolbar a { color: inherit; font-weight: 700; text-decoration: none; }
  .cv-toolbar a:hover { text-decoration: underline; }
  .cv-toolbar div { display: flex; align-items: center; gap: 14px; }
  .cv-toolbar button {
    background: #FF48B0; color: #FF48B0#24346E; border: 0; border-radius: 7px;
    padding: 9px 14px; font: inherit; font-weight: 700; cursor: pointer;
  }
  .cv-toolbar button:hover { filter: brightness(1.15); }
  .cv-toolbar :focus-visible { outline: 3px solid #FFC145; outline-offset: 3px; }
  @media screen and (max-width: 820px) { .cv-toolbar { margin: 0; padding: 12px 16px; } .cv-toolbar span { display: none; } }
  @media print { .cv-toolbar { display: none; } }
</style>
</head>
<body data-design="riso">
<nav class="cv-toolbar" aria-label="Design controls">
  <a href="../index.html">← All designs</a>
  <div><span>07 / Riso</span><button type="button" onclick="window.print()">Print / PDF</button></div>
</nav>
<main class="page">
  <div class="dots y" aria-hidden="true"></div>
  <div class="dots p" aria-hidden="true"></div>

  <h1 class="name"><span data-cv="firstName"></span><span data-cv="lastName"></span></h1>
  <div class="photo-wrap"><img src="photo.jpg" alt="Laura Leiboff"></div>
  <div class="badge"><b data-cv="countries"></b><span>countries<br>and counting</span></div>

  <p class="tagline" data-cv="title"></p>
  <p class="contact"><span data-cv="phone"></span> &nbsp;/&nbsp; <a data-cv="email"></a> &nbsp;/&nbsp; <span data-cv="nationality"></span></p>

  <p class="about" data-cv="about"></p>

  <div class="cols">
    <section>
      <h2>Work</h2>
      <ol class="jobs" reversed data-jobs></ol>
    </section>

    <aside class="side">
      <section class="kili"><span data-cv="kilimanjaro"></span> × Kilimanjaro<small>5,895 m, with the whole team on top</small></section>
      <section>
        <h2>Languages</h2>
        <ul class="lang" data-languages></ul>
      </section>
      <section>
        <h2>Studied</h2>
        <ul data-education></ul>
      </section>
      <section>
        <h2>Loves</h2>
        <div class="chips" data-interests></div>
      </section>
    </aside>
  </div>
</main>
<script src="../content.js"></script>
<script src="render.js"></script>
</body>
</html>
